services:
  - type: web
    name: document-intelligence-platform
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/v1/health
    envVars:
      - key: APP_ENV
        value: production
      - key: LOG_LEVEL
        value: INFO
      - key: DATABASE_URL
        fromDatabase:
          name: document-intelligence-db
          property: connectionString
      - key: CORS_ORIGINS
        value: "*"
      - key: ALLOWED_HOSTS
        value: "*"
      - key: MAX_UPLOAD_PAGES
        value: "3"
      - key: MAX_UPLOAD_SIZE_MB
        value: "15"
      - key: OCR_PROVIDER
        value: local
      - key: LLM_PROVIDER
        value: not_configured

databases:
  - name: document-intelligence-db
    plan: free
    region: singapore
    databaseName: document_intelligence
    user: document_intelligence
